{% extends "base.html" %}

{% block title %}Create Blog{% endblock %}

{% block content %}
	<h1>Create Blog</h1>

	<form action="{{ url_for('create_blog') }}" method="post">
		<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
		<label for="title">Title</label>
		<input type="text" id="title" name="title" maxlength="60" required>

		<label for="content">Content</label>
		<textarea id="content" name="content" minlength="1500" required></textarea>

		<div class="form-actions">
			<a href="{{ url_for('homepage') }}" class="btn btn-secondary">Cancel</a>
			<button type="submit" class="btn btn-primary">Create Blog</button>
		</div>
	</form>
{% endblock %}
